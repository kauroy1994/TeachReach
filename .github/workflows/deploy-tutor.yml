name: Deploy office-hours tutor
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'tutor-worker/*.mjs'
      - 'tutor-worker/build_search.py'
      - 'scripts/build_tutor_index.py'
      - 'wrangler.jsonc'
permissions:
  contents: read
jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Test tutor with the current course index
        run: |
          python3 scripts/build_tutor_index.py --check
          python3 scripts/build_tutor_index.py
          python3 tutor-worker/build_search.py
          node --test tutor-worker/*.test.mjs
      - name: Deploy the tutor to Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.168.0 deploy
