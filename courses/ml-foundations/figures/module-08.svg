<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 480 270">
<title id="title">Adding two rectified linear units</title><desc id="desc">The first hidden unit responds to positive inputs, the second to negative inputs, and their sum equals the absolute value at −2, 0, and 2.</desc>
<rect width="480" height="270" rx="14" fill="#fff"/>
<g font-family="system-ui, sans-serif">
<text x="16" y="31" fill="#213647" font-size="22" font-weight="700" text-anchor="start">Two hidden units build a V</text>
<text x="16" y="56" fill="#546676" font-size="17" font-weight="500" text-anchor="start">Dashed lines mark output 2. The horizontal axes mark 0.</text>
<text x="82" y="89" fill="#006d74" font-size="20" font-weight="700" text-anchor="middle">ReLU(x)</text>
<line x1="20.40" y1="190.00" x2="143.60" y2="190.00" stroke="#546676" stroke-width="1.8"/>
<line x1="82.00" y1="197.02" x2="82.00" y2="104.20" stroke="#d6dfe5" stroke-width="1.5"/>
<line x1="26.00" y1="112.00" x2="138.00" y2="112.00" stroke="#d6dfe5" stroke-width="1" stroke-dasharray="4 4"/>
<polyline points="26.00,190.00 82.00,190.00 138.00,112.00" stroke="#006d74" fill="none" stroke-width="4" stroke-linejoin="round"/>
<circle cx="26.00" cy="190.00" r="4" fill="#006d74" stroke="white" stroke-width="2"/>
<text x="26" y="214" fill="#546676" font-size="16" font-weight="500" text-anchor="middle">−2</text>
<circle cx="82.00" cy="190.00" r="4" fill="#006d74" stroke="white" stroke-width="2"/>
<text x="82" y="214" fill="#546676" font-size="16" font-weight="500" text-anchor="middle">0</text>
<circle cx="138.00" cy="112.00" r="4" fill="#006d74" stroke="white" stroke-width="2"/>
<text x="138" y="214" fill="#546676" font-size="16" font-weight="500" text-anchor="middle">2</text>
<text x="239" y="89" fill="#9e1b32" font-size="20" font-weight="700" text-anchor="middle">ReLU(−x)</text>
<line x1="177.40" y1="190.00" x2="300.60" y2="190.00" stroke="#546676" stroke-width="1.8"/>
<line x1="239.00" y1="197.02" x2="239.00" y2="104.20" stroke="#d6dfe5" stroke-width="1.5"/>
<line x1="183.00" y1="112.00" x2="295.00" y2="112.00" stroke="#d6dfe5" stroke-width="1" stroke-dasharray="4 4"/>
<polyline points="183.00,112.00 239.00,190.00 295.00,190.00" stroke="#9e1b32" fill="none" stroke-width="4" stroke-linejoin="round"/>
<circle cx="183.00" cy="112.00" r="4" fill="#9e1b32" stroke="white" stroke-width="2"/>
<text x="183" y="214" fill="#546676" font-size="16" font-weight="500" text-anchor="middle">−2</text>
<circle cx="239.00" cy="190.00" r="4" fill="#9e1b32" stroke="white" stroke-width="2"/>
<text x="239" y="214" fill="#546676" font-size="16" font-weight="500" text-anchor="middle">0</text>
<circle cx="295.00" cy="190.00" r="4" fill="#9e1b32" stroke="white" stroke-width="2"/>
<text x="295" y="214" fill="#546676" font-size="16" font-weight="500" text-anchor="middle">2</text>
<text x="396" y="89" fill="#213647" font-size="20" font-weight="700" text-anchor="middle">Sum</text>
<line x1="334.40" y1="190.00" x2="457.60" y2="190.00" stroke="#546676" stroke-width="1.8"/>
<line x1="396.00" y1="197.02" x2="396.00" y2="104.20" stroke="#d6dfe5" stroke-width="1.5"/>
<line x1="340.00" y1="112.00" x2="452.00" y2="112.00" stroke="#d6dfe5" stroke-width="1" stroke-dasharray="4 4"/>
<polyline points="340.00,112.00 396.00,190.00 452.00,112.00" stroke="#213647" fill="none" stroke-width="4" stroke-linejoin="round"/>
<circle cx="340.00" cy="112.00" r="4" fill="#213647" stroke="white" stroke-width="2"/>
<text x="340" y="214" fill="#546676" font-size="16" font-weight="500" text-anchor="middle">−2</text>
<circle cx="396.00" cy="190.00" r="4" fill="#213647" stroke="white" stroke-width="2"/>
<text x="396" y="214" fill="#546676" font-size="16" font-weight="500" text-anchor="middle">0</text>
<circle cx="452.00" cy="112.00" r="4" fill="#213647" stroke="white" stroke-width="2"/>
<text x="452" y="214" fill="#546676" font-size="16" font-weight="500" text-anchor="middle">2</text>
<text x="240" y="247" fill="#213647" font-size="19" font-weight="700" text-anchor="middle">At x = −2:   0 + 2 = 2</text>
</g>
</svg>
