<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 480 270">
<title id="title">Sliding a two-reading change detector</title><desc id="desc">Sliding a difference filter across [1, 1, 3, 2] gives 0, 2 and −1; ReLU keeps the positive change and outputs [0, 2, 0].</desc>
<rect width="480" height="270" rx="14" fill="#fff"/>
<g font-family="system-ui, sans-serif">
<text x="16" y="31" fill="#213647" font-size="22" font-weight="700" text-anchor="start">One filter, three adjacent windows</text>
<text x="16" y="56" fill="#546676" font-size="17" font-weight="500" text-anchor="start">Reading</text>
<text x="462" y="56" fill="#006d74" font-size="18" font-weight="700" text-anchor="end">Filter [−1, 1]</text>
<line x1="60.00" y1="149.00" x2="416.00" y2="149.00" stroke="#d6dfe5" stroke-width="1"/>
<text x="46" y="154" fill="#546676" font-size="16" font-weight="500" text-anchor="end">1</text>
<line x1="60.00" y1="115.00" x2="416.00" y2="115.00" stroke="#d6dfe5" stroke-width="1"/>
<text x="46" y="120" fill="#546676" font-size="16" font-weight="500" text-anchor="end">2</text>
<line x1="60.00" y1="81.00" x2="416.00" y2="81.00" stroke="#d6dfe5" stroke-width="1"/>
<text x="46" y="86" fill="#546676" font-size="16" font-weight="500" text-anchor="end">3</text>
<polyline points="70.00,149.00 182.00,149.00 294.00,81.00 406.00,115.00" stroke="#006d74" fill="none" stroke-width="4" stroke-linejoin="round"/>
<circle cx="70.00" cy="149.00" r="6" fill="#006d74" stroke="white" stroke-width="2"/>
<circle cx="182.00" cy="149.00" r="6" fill="#006d74" stroke="white" stroke-width="2"/>
<circle cx="294.00" cy="81.00" r="6" fill="#006d74" stroke="white" stroke-width="2"/>
<circle cx="406.00" cy="115.00" r="6" fill="#006d74" stroke="white" stroke-width="2"/>
<line x1="73.00" y1="175.00" x2="179.00" y2="175.00" stroke="#546676" stroke-width="1.5"/>
<line x1="73.00" y1="169.00" x2="73.00" y2="175.00" stroke="#546676" stroke-width="1.5"/>
<line x1="179.00" y1="169.00" x2="179.00" y2="175.00" stroke="#546676" stroke-width="1.5"/>
<text x="126.0" y="203" fill="#213647" font-size="17" font-weight="700" text-anchor="middle">1 − 1 = 0</text>
<line x1="185.00" y1="175.00" x2="291.00" y2="175.00" stroke="#546676" stroke-width="1.5"/>
<line x1="185.00" y1="169.00" x2="185.00" y2="175.00" stroke="#546676" stroke-width="1.5"/>
<line x1="291.00" y1="169.00" x2="291.00" y2="175.00" stroke="#546676" stroke-width="1.5"/>
<text x="238.0" y="203" fill="#213647" font-size="17" font-weight="700" text-anchor="middle">3 − 1 = 2</text>
<line x1="297.00" y1="175.00" x2="403.00" y2="175.00" stroke="#546676" stroke-width="1.5"/>
<line x1="297.00" y1="169.00" x2="297.00" y2="175.00" stroke="#546676" stroke-width="1.5"/>
<line x1="403.00" y1="169.00" x2="403.00" y2="175.00" stroke="#546676" stroke-width="1.5"/>
<text x="350.0" y="203" fill="#213647" font-size="17" font-weight="700" text-anchor="middle">2 − 3 = −1</text>
<text x="240" y="245" fill="#9e1b32" font-size="18" font-weight="700" text-anchor="middle">ReLU keeps the rises:   [0, 2, 0]</text>
</g>
</svg>
