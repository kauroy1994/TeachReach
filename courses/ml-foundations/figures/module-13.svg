<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 288" role="img" aria-labelledby="title desc" font-family="Arial, Helvetica, sans-serif">
  <title id="title">How much original signal remains?</title>
  <desc id="desc">With 80% power retained at each step, original signal power remaining is 100% at step 0, then 80%, 64%, and 51.2% at steps 1, 2 and 3.</desc>
  <rect x="0" y="0" width="480" height="288" rx="12" fill="#FFFFFF" />
  <text x="20" y="32" fill="#203346" font-size="23" text-anchor="start" font-weight="bold">How much original signal remains?</text>
  <text x="24" y="65" fill="#465B6D" font-size="17" text-anchor="start">Original signal power retained</text>
  <line x1="64" y1="228" x2="446" y2="228" stroke="#D0DCE3" stroke-width="1.5" stroke-linecap="round" />
  <text x="55" y="233" fill="#465B6D" font-size="16" text-anchor="end">0%</text>
  <line x1="64" y1="162.0" x2="446" y2="162.0" stroke="#D0DCE3" stroke-width="1.5" stroke-linecap="round" />
  <text x="55" y="167.0" fill="#465B6D" font-size="16" text-anchor="end">50%</text>
  <line x1="64" y1="96" x2="446" y2="96" stroke="#D0DCE3" stroke-width="1.5" stroke-linecap="round" />
  <text x="55" y="101" fill="#465B6D" font-size="16" text-anchor="end">100%</text>
  <rect x="72" y="96.0" width="40" height="132.0" rx="3" fill="#006D71" />
  <text x="92" y="88.0" fill="#006D71" font-size="17" text-anchor="middle" font-weight="bold">100%</text>
  <text x="92" y="253" fill="#465B6D" font-size="17" text-anchor="middle">0</text>
  <rect x="170" y="122.39999999999999" width="40" height="105.60000000000001" rx="3" fill="#9E1B32" />
  <text x="190" y="114.39999999999999" fill="#9E1B32" font-size="17" text-anchor="middle" font-weight="bold">80%</text>
  <text x="190" y="253" fill="#465B6D" font-size="17" text-anchor="middle">1</text>
  <rect x="268" y="143.51999999999998" width="40" height="84.48000000000002" rx="3" fill="#9E1B32" />
  <text x="288" y="135.51999999999998" fill="#9E1B32" font-size="17" text-anchor="middle" font-weight="bold">64%</text>
  <text x="288" y="253" fill="#465B6D" font-size="17" text-anchor="middle">2</text>
  <rect x="366" y="160.416" width="40" height="67.584" rx="3" fill="#9E1B32" />
  <text x="386" y="152.416" fill="#9E1B32" font-size="17" text-anchor="middle" font-weight="bold">51.2%</text>
  <text x="386" y="253" fill="#465B6D" font-size="17" text-anchor="middle">3</text>
  <text x="239" y="279" fill="#203346" font-size="17" text-anchor="middle">Noise step</text>
</svg>