<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 288" role="img" aria-labelledby="title desc" font-family="Arial, Helvetica, sans-serif">
  <title id="title">Compare forecasts with outcomes</title>
  <desc id="desc">Five cases forecast 0.4 with two successes. Ten cases forecast 0.9 with six successes. The high forecast point is 0.3 below the perfect calibration line.</desc>
  <rect x="0" y="0" width="480" height="288" rx="12" fill="#FFFFFF" />
  <text x="20" y="32" fill="#203346" font-size="23" text-anchor="start" font-weight="bold">Compare forecasts with outcomes</text>
  <text x="22" y="63" fill="#465B6D" font-size="17" text-anchor="start">Observed success fraction</text>
  <line x1="76" y1="225" x2="398" y2="225" stroke="#D0DCE3" stroke-width="1.5" stroke-linecap="round" />
  <text x="61" y="230" fill="#465B6D" font-size="16" text-anchor="end">0</text>
  <text x="76" y="250" fill="#465B6D" font-size="16" text-anchor="middle">0</text>
  <line x1="76" y1="153.5" x2="398" y2="153.5" stroke="#D0DCE3" stroke-width="1.5" stroke-linecap="round" />
  <text x="61" y="158.5" fill="#465B6D" font-size="16" text-anchor="end">0.5</text>
  <text x="237.0" y="250" fill="#465B6D" font-size="16" text-anchor="middle">0.5</text>
  <line x1="76" y1="82" x2="398" y2="82" stroke="#D0DCE3" stroke-width="1.5" stroke-linecap="round" />
  <text x="61" y="87" fill="#465B6D" font-size="16" text-anchor="end">1</text>
  <text x="398" y="250" fill="#465B6D" font-size="16" text-anchor="middle">1</text>
  <line x1="76" y1="225" x2="76" y2="82" stroke="#465B6D" stroke-width="1.5" stroke-linecap="round" />
  <line x1="76" y1="225" x2="398" y2="82" stroke="#006D71" stroke-width="3" stroke-dasharray="7 5" stroke-linecap="round" />
  <line x1="365.8" y1="139.2" x2="365.8" y2="96.29999999999998" stroke="#9E1B32" stroke-width="2" stroke-dasharray="3 4" stroke-linecap="round" />
  <circle cx="204.8" cy="167.8" r="7" fill="#006D71" />
  <circle cx="365.8" cy="139.2" r="7" fill="#9E1B32" />
  <text x="216.8" y="196.8" fill="#006D71" font-size="17" text-anchor="start" font-weight="bold">2 of 5</text>
  <text x="354.8" y="161.2" fill="#9E1B32" font-size="17" text-anchor="end" font-weight="bold">6 of 10</text>
  <text x="353.8" y="90.29999999999998" fill="#9E1B32" font-size="17" text-anchor="end" font-weight="bold">0.30 gap</text>
  <text x="238" y="278" fill="#203346" font-size="18" text-anchor="middle">Mean forecast</text>
</svg>