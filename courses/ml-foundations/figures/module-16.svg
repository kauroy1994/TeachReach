<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 288" role="img" aria-labelledby="title desc" font-family="Arial, Helvetica, sans-serif">
  <title id="title">Compare errors for the same students</title>
  <desc id="desc">Absolute errors on Rin, Sol, Tay and Uma are 4.5, 4.5, 5.5 and 12.5 points for the training mean, and 3, 2, 7 and 5 points for the fitted line. The line is worse on Tay despite lower overall error.</desc>
  <rect x="0" y="0" width="480" height="288" rx="12" fill="#FFFFFF" />
  <text x="20" y="32" fill="#203346" font-size="23" text-anchor="start" font-weight="bold">Compare errors for the same students</text>
  <circle cx="30" cy="61" r="6" fill="#006D71" />
  <text x="43" y="67" fill="#203346" font-size="17" text-anchor="start">Training mean</text>
  <rect x="217.0" y="55.0" width="12" height="12" fill="#9E1B32" />
  <text x="236" y="67" fill="#203346" font-size="17" text-anchor="start">Fitted hours line</text>
  <line x1="95" y1="88" x2="95" y2="224" stroke="#D0DCE3" stroke-width="1.5" stroke-linecap="round" />
  <line x1="220" y1="88" x2="220" y2="224" stroke="#D0DCE3" stroke-width="1.5" stroke-linecap="round" />
  <line x1="345" y1="88" x2="345" y2="224" stroke="#D0DCE3" stroke-width="1.5" stroke-linecap="round" />
  <text x="69" y="109" fill="#203346" font-size="17" text-anchor="end" font-weight="bold">Rin</text>
  <line x1="207.5" y1="103" x2="170" y2="103" stroke="#9CADB9" stroke-width="3" stroke-linecap="round" />
  <circle cx="207.5" cy="103" r="6.5" fill="#006D71" />
  <rect x="164.0" y="97.0" width="12" height="12" fill="#9E1B32" />
  <text x="216.5" y="108" fill="#006D71" font-size="16" text-anchor="start" font-weight="bold">4.5</text>
  <text x="161" y="108" fill="#9E1B32" font-size="16" text-anchor="end" font-weight="bold">3</text>
  <text x="69" y="145" fill="#203346" font-size="17" text-anchor="end" font-weight="bold">Sol</text>
  <line x1="207.5" y1="139" x2="145" y2="139" stroke="#9CADB9" stroke-width="3" stroke-linecap="round" />
  <circle cx="207.5" cy="139" r="6.5" fill="#006D71" />
  <rect x="139.0" y="133.0" width="12" height="12" fill="#9E1B32" />
  <text x="216.5" y="144" fill="#006D71" font-size="16" text-anchor="start" font-weight="bold">4.5</text>
  <text x="136" y="144" fill="#9E1B32" font-size="16" text-anchor="end" font-weight="bold">2</text>
  <text x="69" y="181" fill="#203346" font-size="17" text-anchor="end" font-weight="bold">Tay</text>
  <line x1="232.5" y1="175" x2="270" y2="175" stroke="#9CADB9" stroke-width="3" stroke-linecap="round" />
  <circle cx="232.5" cy="175" r="6.5" fill="#006D71" />
  <rect x="264.0" y="169.0" width="12" height="12" fill="#9E1B32" />
  <text x="223.5" y="180" fill="#006D71" font-size="16" text-anchor="end" font-weight="bold">5.5</text>
  <text x="279" y="180" fill="#9E1B32" font-size="16" text-anchor="start" font-weight="bold">7</text>
  <text x="69" y="217" fill="#203346" font-size="17" text-anchor="end" font-weight="bold">Uma</text>
  <line x1="407.5" y1="211" x2="220" y2="211" stroke="#9CADB9" stroke-width="3" stroke-linecap="round" />
  <circle cx="407.5" cy="211" r="6.5" fill="#006D71" />
  <rect x="214.0" y="205.0" width="12" height="12" fill="#9E1B32" />
  <text x="416.5" y="216" fill="#006D71" font-size="16" text-anchor="start" font-weight="bold">12.5</text>
  <text x="211" y="216" fill="#9E1B32" font-size="16" text-anchor="end" font-weight="bold">5</text>
  <line x1="95" y1="227" x2="420" y2="227" stroke="#465B6D" stroke-width="1.5" stroke-linecap="round" />
  <text x="95" y="249" fill="#465B6D" font-size="16" text-anchor="middle">0</text>
  <text x="220" y="249" fill="#465B6D" font-size="16" text-anchor="middle">5</text>
  <text x="345" y="249" fill="#465B6D" font-size="16" text-anchor="middle">10</text>
  <text x="248" y="276" fill="#203346" font-size="18" text-anchor="middle">Absolute error (score points)</text>
</svg>