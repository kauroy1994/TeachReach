/* Seven motivating, animated opening slides */

.intro-compare{display:grid;grid-template-columns:1fr 75px 1fr;gap:14px;align-items:center}.intro-card{min-height:280px;display:flex;flex-direction:column;gap:25px}.intro-card.strong{border:2px solid #9E1B32;background:#fff5f6}.intro-transfer{color:#9E1B32;font-size:52px;text-align:center}.intro-rule{font-size:clamp(23px,2.7vw,38px);letter-spacing:-.04em;line-height:1.4;font-weight:850}.intro-rule span{color:#9E1B32}
